version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: neuroportal-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: neuroportal-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/neuroportal}
      - JWT_SECRET=${JWT_SECRET:?Set a strong JWT_SECRET in the deployment environment}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CLIENT_URL=${CLIENT_URL:?Set CLIENT_URL to the deployed frontend origin}
    depends_on:
      mongo:
        condition: service_healthy

  ai-service:
    build:
      context: ./server/ai-service
      dockerfile: Dockerfile
    container_name: neuroportal-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:?Set VITE_API_URL to the deployed API base URL}
        - VITE_AI_SERVICE_URL=${VITE_AI_SERVICE_URL:?Set VITE_AI_SERVICE_URL to the deployed AI service base URL}
    container_name: neuroportal-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server
      - ai-service

volumes:
  mongo_data:

